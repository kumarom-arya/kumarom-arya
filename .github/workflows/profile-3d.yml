# Put this file at: .github/workflows/profile-3d.yml
# in your special profile repo (kumarom-arya/kumarom-arya)
#
# It generates a rotating 3D contribution calendar SVG once a day and
# commits it back to the repo at profile-3d-contrib/profile-green-animate.svg
# (the exact path already referenced in README.md).

name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC — change to whatever time suits you
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
